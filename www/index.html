<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التحول الرقمي V10.5 Firebase</title><style>
:root{--g:#075c4b;--g2:#0d7662;--bg:#f3f7f5;--line:#dce8e3;--muted:#71817b}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial;color:#17352d}.app{max-width:760px;margin:auto;min-height:100vh;background:#fbfdfc}.head{background:linear-gradient(135deg,var(--g),var(--g2));color:white;padding:20px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:3}.head h1{margin:0;font-size:21px}.head button{background:#ffffff18;border:1px solid #ffffff55;color:white;padding:9px 12px;border-radius:10px}.wrap{padding:16px}.card,.req,.note,.cat{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 4px 16px #003b2410}.hidden{display:none!important}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border:1px solid #cadbd4;border-radius:10px;background:white}textarea{min-height:80px}.primary,.card button,.cat button{border:0;background:var(--g);color:white;padding:11px 14px;border-radius:10px;font-weight:700;cursor:pointer}.wide{width:100%;margin-top:12px}.req{display:grid;width:100%;text-align:right;cursor:pointer;gap:7px}.req small,.note small{display:block;color:var(--muted)}.badge{background:#e8f5f0;color:var(--g);padding:4px 8px;border-radius:12px;font-size:12px;float:left}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{background:#e8f5f0;padding:12px;border-radius:13px;text-align:center}.kpi b{display:block;font-size:24px;color:var(--g)}.info{display:grid;grid-template-columns:120px 1fr;gap:8px;border-top:1px solid var(--line);padding-top:12px}.actiongrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.actiongrid button{padding:12px;border-radius:10px;border:1px solid var(--g);background:white;color:var(--g);font-weight:700}.actiongrid .primary{background:var(--g);color:white}.check{display:flex;gap:8px;align-items:center}.check input{width:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.nav button{flex:1;border:1px solid var(--line);background:white;padding:10px;border-radius:10px}.cat{display:flex;justify-content:space-between;align-items:center}.cat button{background:#a13b3b}.empty{text-align:center;color:var(--muted);padding:25px}.msg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:11px 16px;border-radius:10px;color:white;z-index:10}.msg.ok{background:#17352d}.msg.bad{background:#a13b3b}.setup{border-right:5px solid #d09b22}.muted{color:var(--muted)}@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr}.info{grid-template-columns:100px 1fr}}
</style><script defer src="config.js"></script><script defer src="app.js"></script></head><body><div class="app"><header class="head"><div><h1>التحول الرقمي</h1><small id="who">نظام الدعم الفني</small></div><div><button onclick="V10.notifications()">🔔 <b id="notifCount">0</b></button> <button onclick="V10.logout()">خروج</button></div></header><main class="wrap">
<section id="setup" class="hidden"></section>
<section id="login" class="hidden"><div class="card"><h2>تسجيل الدخول</h2><form onsubmit="V10.login(event)"><label>البريد الإلكتروني</label><input id="email" type="email" required><label>كلمة المرور</label><input id="password" type="password" required><button id="loginBtn" class="primary wide">دخول</button></form></div></section>
<section id="employee" class="hidden"><div class="card"><h2>طلب دعم فني جديد</h2><form onsubmit="V10.createRequest(event)"><label>اسم الموظف</label><input id="employeeName" type="text" maxlength="100" autocomplete="name" placeholder="اكتب اسم الموظف" required><label>الدائرة</label><select id="dept" required></select><label>نوع الطلب</label><select id="type" required></select><label>اليوم المطلوب</label><input id="date" type="date" required><label>الوصف</label><textarea id="desc"></textarea><button id="sendBtn" class="primary wide">إرسال الطلب</button></form></div><h2>طلباتي</h2><div id="myRequests"></div></section>
<section id="admin" class="hidden"><div class="kpis" id="kpis"></div><div class="nav"><button onclick="V10.catalogs()">إدارة القوائم</button><button onclick="V10.stats()">إحصائيات المسؤولين</button><button onclick="V10.notifications()">الإشعارات</button></div><h2>الطلبات</h2><div id="allRequests"></div></section>
<section id="details" class="hidden"><button class="primary" onclick="V10.back()">رجوع</button><div class="card" id="detailsBody"></div></section>
<section id="catalogs" class="hidden"><button class="primary" onclick="V10.back()">رجوع</button><div class="card"><h2 id="catalogTitle">إدارة القوائم</h2><div class="nav"><button onclick="V10.renderCatalogs('departments')">الدوائر</button><button onclick="V10.renderCatalogs('request_types')">أنواع الطلبات</button><button onclick="V10.renderCatalogs('assignees')">المسؤولون عن المهام</button></div><div style="display:flex;gap:8px"><input id="catalogName" placeholder="اسم جديد"><button id="catalogAdd" class="primary">إضافة</button></div><div id="catalogList"></div></div></section>
<section id="stats" class="hidden"><button class="primary" onclick="V10.back()">رجوع</button><div class="card"><h2>إحصائيات المسؤولين عن المهام</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>من تاريخ</label><input id="statsFrom" type="date"></div><div><label>إلى تاريخ</label><input id="statsTo" type="date"></div></div><button class="primary wide" onclick="V10.renderStats()">عرض الإحصائيات</button></div><div id="statsSummary" class="kpis"></div><div id="statsList"></div></section>
<section id="notifications" class="hidden"><button class="primary" onclick="V10.back()">رجوع</button><div class="card"><h2>الإشعارات</h2><button class="primary" onclick="V10.markAllRead()">تحديد الكل كمقروء</button><div id="notificationList"></div></div></section>
</main></div><div id="msg"></div></body></html>
